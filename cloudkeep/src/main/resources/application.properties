
server.servlet.context-path=/api/v1.0

#mongodb configuration
spring.mongodb.uri=mongodb://localhost:27017/cloudkeep
spring.data.mongodb.auto-index-creation=true

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

#clerk configuration
clerk.issuer=https://hardy-mink-36.clerk.accounts.dev
clerk.jwks-url=https://hardy-mink-36.clerk.accounts.dev/.well-known/jwks.json
clerk.webhook.secret=${CLERK_WEBHOOK_SECRET}

#fileUploadConfiguration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

#payment configuration
razorpay.key.id=${RAZORPAY_API_KEY}
razorpay.secret.key=${RAZORPAY_SECRET_KEY}
